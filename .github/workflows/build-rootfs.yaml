name: Build compatibility-locked ImmortalWrt rootfs

run-name: Rootfs / manual run ${{ github.run_number }}

on:
  workflow_dispatch:

permissions: {}

env:
  TZ: Asia/Shanghai
  BUILDER_IMAGE: ghcr.io/biaogo94/cleanopenwrt-n1-builder@sha256:00ad00c673d9135d4653234c65e0a755bea7343344157ef1656a546431394efc

concurrency:
  group: build-n1-rootfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build rootfs in GHCR environment
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull compatibility-locked build environment
        id: builder
        run: |
          docker pull "$BUILDER_IMAGE"
          digest="$(docker image inspect "$BUILDER_IMAGE" --format '{{index .RepoDigests 0}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "false"

      - name: Check out repository on expanded workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify compatibility lock
        run: |
          set -euo pipefail
          . ./build-lock.env
          test "$LOCK_SCHEMA" = 1
          test "$LOCK_BUILDER_IMAGE@$LOCK_BUILDER_DIGEST" = "$BUILDER_IMAGE"

      - name: Restore exact-lock downloads and compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/dl
            .cache/ccache
          key: n1-rootfs-${{ runner.os }}-${{ hashFiles('Dockerfile', 'scripts/build-immortalwrt.sh', 'build-lock.env') }}-${{ github.run_id }}
          restore-keys: |
            n1-rootfs-${{ runner.os }}-${{ hashFiles('Dockerfile', 'scripts/build-immortalwrt.sh', 'build-lock.env') }}-

      - name: Build ImmortalWrt rootfs
        env:
          BUILDER_IMAGE_DIGEST: ${{ steps.builder.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cache/dl .cache/ccache
          docker run --rm \
            --env BUILDER_IMAGE \
            --env BUILDER_IMAGE_DIGEST \
            --env GITHUB_TOKEN \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$GITHUB_WORKSPACE/.cache:/cache" \
            --workdir /workspace \
            "$BUILDER_IMAGE" \
            bash scripts/build-immortalwrt.sh

      - name: Fix cache ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" .cache || true

      - name: Save exact-lock downloads and compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/dl
            .cache/ccache
          key: n1-rootfs-${{ runner.os }}-${{ hashFiles('Dockerfile', 'scripts/build-immortalwrt.sh', 'build-lock.env') }}-${{ github.run_id }}

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immortalwrt-rootfs-${{ github.run_id }}
          path: artifacts/rootfs/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish durable rootfs release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download rootfs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immortalwrt-rootfs-${{ github.run_id }}
          path: rootfs

      - name: Generate checksums
        run: |
          cd rootfs
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z \
            | xargs -0 -r sha256sum \
            > SHA256SUMS

      - name: Publish rootfs release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ImmortalWrt-N1-rootfs-r${{ github.run_number }}
          name: Compatibility-locked ImmortalWrt N1 rootfs
          make_latest: false
          fail_on_unmatched_files: true
          files: rootfs/*
          body: |
            Compatibility-locked ARMv8 rootfs for the N1 packaging workflow.

            This release does not automatically replace the stable rootfs in
            `build-lock.env`. Promote it only after full N1 packaging and boot tests.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
