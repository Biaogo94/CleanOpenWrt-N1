# Long immutable action pins and cache expressions must remain single-line.
# yamllint disable rule:line-length
---
name: Build latest ImmortalWrt rootfs

run-name: Rootfs / manual run ${{ github.run_number }}

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Full build or source/config preflight only
        type: choice
        options: [full, preflight]
        default: full
      replay_run_id:
        description: Optional prior run ID with build-inputs artifact (same project revision required)
        type: string
        default: ""

permissions: {}

env:
  TZ: Asia/Shanghai
  BUILDER_IMAGE: ghcr.io/biaogo94/cleanopenwrt-n1-builder:latest

concurrency:
  group: build-n1-rootfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
  build:
    needs: checks
    name: Build rootfs in GHCR environment
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - name: Check out build inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize diagnostics
        run: |
          mkdir -p artifacts/diagnostics
          git rev-parse HEAD > artifacts/diagnostics/project-ref.txt

      - name: Download replay manifest
        if: inputs.replay_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLAY_RUN: ${{ inputs.replay_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$REPLAY_RUN" =~ ^[0-9]+$ ]]
          gh run download "$REPLAY_RUN" --repo "$REPOSITORY" --name build-inputs --dir replay
          python3 scripts/run-stage.py artifacts/diagnostics replay-validate python3 scripts/build_inputs.py validate --manifest replay/build-inputs.json
          cp replay/build-inputs.json build-inputs.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest build environment
        id: builder
        env:
          REPLAY_RUN: ${{ inputs.replay_run_id }}
        run: |
          if [[ -n "$REPLAY_RUN" ]]; then
            digest="$(python3 -c 'import json; print(json.load(open("build-inputs.json"))["builder"])')"
            python3 scripts/run-stage.py artifacts/diagnostics builder-pull docker pull "$digest"
          else
            python3 scripts/run-stage.py artifacts/diagnostics builder-pull docker pull "$BUILDER_IMAGE"
            digest="$(docker image inspect "$BUILDER_IMAGE" --format '{{index .RepoDigests 0}}')"
          fi
          cache_id="${digest##*@}"
          cache_id="${cache_id#sha256:}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "cache_id=$cache_id" >> "$GITHUB_OUTPUT"

      - name: Resolve or validate immutable inputs
        id: sources
        env:
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
          REPLAY_RUN: ${{ inputs.replay_run_id }}
        run: |
          mkdir -p artifacts/diagnostics
          if [[ -z "$REPLAY_RUN" ]]; then
            python3 scripts/run-stage.py artifacts/diagnostics resolve python3 scripts/build_inputs.py resolve --builder "$BUILDER_DIGEST"
          fi
          python3 scripts/build_inputs.py env >> "$GITHUB_OUTPUT"
          cp build-inputs.json artifacts/diagnostics/
          cp build-inputs.json "$RUNNER_TEMP/n1-build-inputs.json"
          cp -r artifacts/diagnostics "$RUNNER_TEMP/n1-early-diagnostics"

      - name: Preserve inputs before compilation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-inputs
          path: build-inputs.json
          if-no-files-found: error
          retention-days: 30

      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "false"

      - name: Check out repository on expanded workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Restore validated input manifest on expanded workspace
        run: |
          cp "$RUNNER_TEMP/n1-build-inputs.json" build-inputs.json
          python3 scripts/build_inputs.py validate
          mkdir -p artifacts/diagnostics
          cp -r "$RUNNER_TEMP/n1-early-diagnostics/." artifacts/diagnostics/
          cp build-inputs.json artifacts/diagnostics/

      - name: Restore exact-source downloads
        id: downloads
        if: inputs.mode != 'preflight'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/dl
          key: n1-dl-${{ runner.os }}-${{ steps.builder.outputs.cache_id }}-${{ steps.sources.outputs.SOURCE_SET_ID }}-${{ hashFiles('scripts/build-immortalwrt.sh', 'scripts/normalize-golang-feed.sh', 'scripts/resolve-build-refs.sh', 'build-lock.env') }}-${{ github.run_id }}
          restore-keys: |
            n1-dl-${{ runner.os }}-${{ steps.builder.outputs.cache_id }}-${{ steps.sources.outputs.SOURCE_SET_ID }}-${{ hashFiles('scripts/build-immortalwrt.sh', 'scripts/normalize-golang-feed.sh', 'scripts/resolve-build-refs.sh', 'build-lock.env') }}-

      - name: Restore isolated Go modules
        id: go_cache
        if: inputs.mode != 'preflight'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/go-mod
          key: n1-go-${{ steps.sources.outputs.SOURCE_SET_ID }}-${{ github.run_id }}
          restore-keys: |
            n1-go-${{ steps.sources.outputs.SOURCE_SET_ID }}-

      - name: Restore compatible compiler cache
        id: compiler_cache
        if: inputs.mode != 'preflight'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/ccache
          key: n1-ccache-${{ runner.os }}-${{ steps.builder.outputs.cache_id }}-${{ hashFiles('Dockerfile', 'scripts/build-immortalwrt.sh', 'build-lock.env') }}-${{ github.run_id }}
          restore-keys: |
            n1-ccache-${{ runner.os }}-${{ steps.builder.outputs.cache_id }}-${{ hashFiles('Dockerfile', 'scripts/build-immortalwrt.sh', 'build-lock.env') }}-

      - name: Build ImmortalWrt rootfs
        env:
          BUILDER_IMAGE_DIGEST: ${{ steps.builder.outputs.digest }}
          BUILD_MODE: ${{ inputs.mode }}
          DOWNLOAD_CACHE: ${{ steps.downloads.outputs.cache-matched-key }}
          COMPILER_CACHE: ${{ steps.compiler_cache.outputs.cache-matched-key }}
          GO_CACHE: ${{ steps.go_cache.outputs.cache-matched-key }}
        run: |
          mkdir -p .cache/dl .cache/ccache .cache/go-mod
          printf 'downloads=%s\nccache=%s\ngo=%s\n' "$DOWNLOAD_CACHE" "$COMPILER_CACHE" "$GO_CACHE" > artifacts/diagnostics/cache-restore.txt
          python3 scripts/run-stage.py artifacts/diagnostics build docker run --rm \
            --env BUILDER_IMAGE --env BUILDER_IMAGE_DIGEST --env BUILD_MODE \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$GITHUB_WORKSPACE/.cache:/cache" \
            --workdir /workspace \
            "$BUILDER_IMAGE_DIGEST" \
            bash scripts/build-immortalwrt.sh

      - name: Fix cache ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" .cache artifacts || true

      - name: Save exact-source downloads
        if: always() && inputs.mode != 'preflight' && steps.sources.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/dl
          key: n1-dl-${{ runner.os }}-${{ steps.builder.outputs.cache_id }}-${{ steps.sources.outputs.SOURCE_SET_ID }}-${{ hashFiles('scripts/build-immortalwrt.sh', 'scripts/normalize-golang-feed.sh', 'scripts/resolve-build-refs.sh', 'build-lock.env') }}-${{ github.run_id }}

      - name: Save isolated Go modules
        if: always() && inputs.mode != 'preflight' && steps.sources.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/go-mod
          key: n1-go-${{ steps.sources.outputs.SOURCE_SET_ID }}-${{ github.run_id }}

      - name: Save compatible compiler cache
        if: always() && inputs.mode != 'preflight' && steps.sources.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/ccache
          key: n1-ccache-${{ runner.os }}-${{ steps.builder.outputs.cache_id }}-${{ hashFiles('Dockerfile', 'scripts/build-immortalwrt.sh', 'build-lock.env') }}-${{ github.run_id }}

      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: artifacts/diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload rootfs artifact
        if: inputs.mode != 'preflight'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immortalwrt-rootfs-${{ github.run_id }}
          path: artifacts/rootfs/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish durable rootfs release
    needs: build
    if: inputs.mode != 'preflight'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write

    steps:
      - name: Download rootfs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immortalwrt-rootfs-${{ github.run_id }}
          path: rootfs

      - name: Prepare rootfs release
        id: rootfs
        run: |
          cd rootfs
          rootfs_file="$(find . -maxdepth 1 -type f -name '*rootfs.tar.gz' -print -quit)"
          test -n "$rootfs_file"
          rootfs_name="${rootfs_file#./}"
          rootfs_sha256="$(sha256sum "$rootfs_name" | awk '{print $1}')"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z \
            | xargs -0 -r sha256sum \
            > SHA256SUMS
          echo "name=$rootfs_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$rootfs_sha256" >> "$GITHUB_OUTPUT"
          echo "tag=ImmortalWrt-N1-rootfs-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish rootfs release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.rootfs.outputs.tag }}
          name: Latest-branch ImmortalWrt N1 rootfs
          make_latest: false
          fail_on_unmatched_files: true
          files: rootfs/*
          body: |
            ARMv8 rootfs built from the latest configured upstream branch heads.
            The immutable SHAs and actual Builder digest are recorded in BUILD_INFO.txt.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Queue N1 packaging with the new rootfs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOTFS_NAME: ${{ steps.rootfs.outputs.name }}
          ROOTFS_SHA256: ${{ steps.rootfs.outputs.sha256 }}
          ROOTFS_TAG: ${{ steps.rootfs.outputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          rootfs_url="${SERVER_URL}/${REPOSITORY}/releases/download/${ROOTFS_TAG}/${ROOTFS_NAME}"
          gh workflow run build-imm.yaml \
            --repo "$REPOSITORY" \
            --ref "$REF_NAME" \
            -f rootfs_url="$rootfs_url" \
            -f rootfs_sha256="$ROOTFS_SHA256"
