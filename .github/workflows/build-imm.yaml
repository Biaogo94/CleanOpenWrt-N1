name: Build ImmortalWrt for Phicomm N1

run-name: N1 / kernel ${{ inputs.kernel_series }} / run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      kernel_series:
        description: Kernel series
        required: true
        default: "6.12"
        type: choice
        options:
          - "6.1"
          - "6.12"
          - "6.18"
      rootfs_run_id:
        description: Reuse rootfs artifact from this run ID (leave empty for a full build)
        required: false
        default: ""
        type: string

permissions: {}

env:
  TZ: Asia/Shanghai
  IMMORTALWRT_BRANCH: openwrt-25.12
  BUILDER_IMAGE: ghcr.io/biaogo94/cleanopenwrt-n1-builder:latest

concurrency:
  group: immortalwrt-n1-${{ inputs.kernel_series }}
  cancel-in-progress: false

jobs:
  build:
    name: Build rootfs in GHCR environment
    if: ${{ inputs.rootfs_run_id == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull online build environment
        id: builder
        run: |
          docker pull "$BUILDER_IMAGE"
          digest="$(docker image inspect "$BUILDER_IMAGE" --format '{{index .RepoDigests 0}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "false"

      - name: Check out repository on expanded workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Restore downloads and compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/dl
            .cache/ccache
          key: n1-immortalwrt-${{ runner.os }}-${{ hashFiles('Dockerfile', 'scripts/build-immortalwrt.sh') }}-${{ github.run_id }}
          restore-keys: |
            n1-immortalwrt-${{ runner.os }}-${{ hashFiles('Dockerfile', 'scripts/build-immortalwrt.sh') }}-
            n1-immortalwrt-${{ runner.os }}-

      - name: Build ImmortalWrt rootfs
        env:
          BUILDER_IMAGE_DIGEST: ${{ steps.builder.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cache/dl .cache/ccache
          docker run --rm \
            --env BUILDER_IMAGE \
            --env BUILDER_IMAGE_DIGEST \
            --env GITHUB_TOKEN \
            --env IMMORTALWRT_BRANCH \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$GITHUB_WORKSPACE/.cache:/cache" \
            --workdir /workspace \
            "$BUILDER_IMAGE" \
            bash scripts/build-immortalwrt.sh

      - name: Fix cache ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" .cache || true

      - name: Save downloads and compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/dl
            .cache/ccache
          key: n1-immortalwrt-${{ runner.os }}-${{ hashFiles('Dockerfile', 'scripts/build-immortalwrt.sh') }}-${{ github.run_id }}

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immortalwrt-rootfs-${{ github.run_id }}
          path: artifacts/rootfs/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package N1 image
    needs: build
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download rootfs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immortalwrt-rootfs-${{ inputs.rootfs_run_id || github.run_id }}
          path: openwrt-armsr
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.rootfs_run_id || github.run_id }}

      - name: Package Phicomm N1 image
        uses: ophub/amlogic-s9xxx-openwrt@34c28d7d3161c8e4b791b91626f4b76353fb3759
        with:
          openwrt_path: openwrt-armsr/*rootfs.tar.gz
          openwrt_board: s905d
          openwrt_kernel: ${{ inputs.kernel_series }}
          auto_kernel: "true"
          kernel_repo: ophub/kernel
          openwrt_size: 256/1024
          openwrt_files: n1-overlay

      - name: Prepare packaged artifact
        run: |
          test -n "${PACKAGED_OUTPUTPATH:-}"
          test -d "$PACKAGED_OUTPUTPATH"
          cp openwrt-armsr/BUILD_INFO.txt "$PACKAGED_OUTPUTPATH/BUILD_INFO.txt"
          actual_kernels="$({
            find "$PACKAGED_OUTPUTPATH" -maxdepth 1 -type f -name '*.img.gz' -printf '%f\n'
          } | sed -nE 's/.*_k([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | sort -Vu | paste -sd, -)"
          actual_kernels="${actual_kernels:-unknown}"
          echo "Requested kernel series=${{ inputs.kernel_series }}" >> "$PACKAGED_OUTPUTPATH/BUILD_INFO.txt"
          echo "Actual kernels=${actual_kernels}" >> "$PACKAGED_OUTPUTPATH/BUILD_INFO.txt"
          echo "Workflow=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$PACKAGED_OUTPUTPATH/BUILD_INFO.txt"
          (
            cd "$PACKAGED_OUTPUTPATH"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 -r sha256sum
          ) > "$PACKAGED_OUTPUTPATH/SHA256SUMS"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immortalwrt-n1-${{ github.run_id }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: package
    if: ${{ always() && !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immortalwrt-n1-${{ github.run_id }}
          path: firmware

      - name: Read release metadata
        id: metadata
        run: |
          actual_kernels="$(sed -n 's/^Actual kernels=//p' firmware/BUILD_INFO.txt | tail -n 1)"
          easytier_version="$(sed -n 's/^EasyTier version=//p' firmware/BUILD_INFO.txt | tail -n 1)"
          echo "actual_kernels=${actual_kernels:-unknown}" >> "$GITHUB_OUTPUT"
          echo "easytier_version=${easytier_version:-unknown}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date +'%Y-%m-%d %H:%M %Z')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ImmortalWrt-N1-k${{ inputs.kernel_series }}-r${{ github.run_number }}
          name: ImmortalWrt Phicomm N1 - kernel ${{ steps.metadata.outputs.actual_kernels }}
          make_latest: true
          fail_on_unmatched_files: true
          files: firmware/*
          body: |
            ## Firmware information

            - Device: Phicomm N1 (Amlogic S905D)
            - ImmortalWrt branch: `openwrt-25.12` (latest revision at build time)
            - Requested kernel series: `${{ inputs.kernel_series }}`
            - Actual kernel: `${{ steps.metadata.outputs.actual_kernels }}`
            - EasyTier: `${{ steps.metadata.outputs.easytier_version }}`
            - Build time: `${{ steps.metadata.outputs.build_date }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Includes PassWall, OpenClash, EasyTier, Amlogic Treasure Box,
            onboard BCM43455 Wi-Fi, Travelmate routed repeater support,
            and optional relayd pseudo-bridge support.

            Verify the image with `SHA256SUMS` and back up eMMC before installation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
