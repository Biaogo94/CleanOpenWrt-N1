name: Package Phicomm N1 firmware

run-name: N1 package / run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: Optional compatible rootfs URL; empty uses build-lock.env
        required: false
        default: ""
        type: string
      rootfs_sha256:
        description: Required SHA256 when rootfs_url is overridden
        required: false
        default: ""
        type: string

permissions: {}

env:
  TZ: Asia/Shanghai

concurrency:
  group: package-n1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package N1 image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      kernel_series: ${{ steps.rootfs.outputs.kernel_series }}
      kernel_version: ${{ steps.metadata.outputs.kernel_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve compatibility-locked rootfs
        id: rootfs
        env:
          INPUT_ROOTFS_URL: ${{ inputs.rootfs_url }}
          INPUT_ROOTFS_SHA256: ${{ inputs.rootfs_sha256 }}
        run: |
          set -euo pipefail
          . ./build-lock.env
          . ./rootfs-lock.env
          test "$LOCK_SCHEMA" = 2
          test "$ROOTFS_LOCK_SCHEMA" = 2
          if [ -n "$INPUT_ROOTFS_URL" ]; then
            test -n "$INPUT_ROOTFS_SHA256"
            rootfs_url="$INPUT_ROOTFS_URL"
            rootfs_sha256="$INPUT_ROOTFS_SHA256"
            rootfs_sha256_url=""
          else
            rootfs_url="$ROOTFS_URL"
            rootfs_sha256=""
            rootfs_sha256_url="$ROOTFS_SHA256_URL"
          fi
          if [ -n "$rootfs_sha256" ]; then
            echo "$rootfs_sha256" | grep -Eq '^[0-9a-fA-F]{64}$'
          fi
          echo "url=$rootfs_url" >> "$GITHUB_OUTPUT"
          echo "sha256=${rootfs_sha256,,}" >> "$GITHUB_OUTPUT"
          echo "sha256_url=$rootfs_sha256_url" >> "$GITHUB_OUTPUT"
          echo "kernel_series=$LOCK_KERNEL_SERIES" >> "$GITHUB_OUTPUT"

      - name: Download and verify rootfs
        id: download
        env:
          ROOTFS_URL: ${{ steps.rootfs.outputs.url }}
          ROOTFS_SHA256: ${{ steps.rootfs.outputs.sha256 }}
          ROOTFS_SHA256_URL: ${{ steps.rootfs.outputs.sha256_url }}
        run: |
          set -euo pipefail
          mkdir -p openwrt-armsr
          curl --fail --location --retry 3 --connect-timeout 15 \
            "$ROOTFS_URL" \
            --output openwrt-armsr/rootfs.tar.gz
          if [ -z "$ROOTFS_SHA256" ]; then
            curl --fail --location --retry 3 --connect-timeout 15 \
              "$ROOTFS_SHA256_URL" \
              --output openwrt-armsr/SHA256SUMS
            ROOTFS_SHA256="$(awk '$2 == "rootfs.tar.gz" || $2 ~ /rootfs\.tar\.gz$/ { print $1; exit }' openwrt-armsr/SHA256SUMS)"
          fi
          echo "$ROOTFS_SHA256" | grep -Eq '^[0-9a-fA-F]{64}$'
          echo "$ROOTFS_SHA256  openwrt-armsr/rootfs.tar.gz" | sha256sum -c -
          echo "sha256=${ROOTFS_SHA256,,}" >> "$GITHUB_OUTPUT"

      - name: Package Phicomm N1 image
        uses: ophub/amlogic-s9xxx-openwrt@34c28d7d3161c8e4b791b91626f4b76353fb3759
        with:
          openwrt_files: n1-overlay
          openwrt_path: openwrt-armsr/rootfs.tar.gz
          openwrt_board: s905d
          openwrt_kernel: ${{ steps.rootfs.outputs.kernel_series }}
          auto_kernel: "true"
          kernel_repo: ophub/kernel
          openwrt_size: 256/1024

      - name: Prepare packaged artifact
        id: metadata
        env:
          ROOTFS_URL: ${{ steps.rootfs.outputs.url }}
          ROOTFS_SHA256: ${{ steps.download.outputs.sha256 }}
          KERNEL_SERIES: ${{ steps.rootfs.outputs.kernel_series }}
        run: |
          set -euo pipefail
          test -f n1-overlay/etc/uci-defaults/90-n1-wireless-fix
          test -f n1-overlay/etc/uci-defaults/91-passwall-local-subscribe-fix
          test -f n1-overlay/etc/uci-defaults/92-disable-haproxy-example
          test -n "${PACKAGED_OUTPUTPATH:-}"
          test -d "$PACKAGED_OUTPUTPATH"
          sudo chown -R "$(id -u):$(id -g)" "$PACKAGED_OUTPUTPATH"
          image_file="$(find "$PACKAGED_OUTPUTPATH" -maxdepth 1 -type f -name '*.img.gz' -print -quit)"
          test -n "$image_file"
          kernel_version="$(basename "$image_file" | sed -nE 's/.*_k([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/p')"
          test -n "$kernel_version"
          printf '%s\n' \
            "Rootfs source=$ROOTFS_URL" \
            "Rootfs SHA256=$ROOTFS_SHA256" \
            "Kernel series=$KERNEL_SERIES" \
            "Actual kernels=$kernel_version" \
            "Workflow=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > "$PACKAGED_OUTPUTPATH/BUILD_INFO.txt"
          (
            cd "$PACKAGED_OUTPUTPATH"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 -r sha256sum
          ) > "$PACKAGED_OUTPUTPATH/SHA256SUMS"
          echo "kernel_version=$kernel_version" >> "$GITHUB_OUTPUT"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immortalwrt-n1-${{ github.run_id }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish N1 release
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immortalwrt-n1-${{ github.run_id }}
          path: firmware

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ImmortalWrt-N1-k${{ needs.package.outputs.kernel_series }}-r${{ github.run_number }}
          name: ImmortalWrt Phicomm N1 - kernel ${{ needs.package.outputs.kernel_version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: firmware/*
          body: |
            ## Firmware information

            - Device: Phicomm N1 (Amlogic S905D)
            - Kernel: `${{ needs.package.outputs.kernel_version }}`
            - Rootfs and dependency versions: compatibility-locked by `build-lock.env`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Includes PassWall, OpenClash, EasyTier, Amlogic Treasure Box,
            onboard BCM43455 Wi-Fi, Travelmate routed repeater support,
            and optional relayd pseudo-bridge support.

            Verify the image with `SHA256SUMS` and back up eMMC before installation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
